name: mood_app
description: "Current Mood app for mood detection using Firebase, ML Kit, and TFLite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  shared_preferences: ^2.2.2
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  camera: ^0.12.0+1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  crypto: ^3.0.7
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_storage: 13.2.0
  cloud_firestore: ^6.2.0
  google_mlkit_face_detection: ^0.13.2
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^11.2.0
  record: ^6.2.1
  path_provider: ^2.1.6
  fftea: ^1.5.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/model/ferplus_model_pd_best.tflite
    - assets/model/SER.tflite
    - assets/app_logo.png
    - assets/chat_mood_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  remove_alpha_ios: true
